<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada | SOLSANIT</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="pageTransition" aria-hidden="true"></div>
<section class="notfound">
  <span class="nf-num">404</span>
  <p>Esta página no existe, o la obra todavía no está en el plano. Vuelva al inicio para seguir el recorrido.</p>
  <a class="cta-link" href="index.html">Volver al inicio →</a>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  document.querySelectorAll('a[href]').forEach((a) => {
    a.addEventListener('click', (e) => {
      const href = a.getAttribute('href');
      if (href.startsWith('#') || href.startsWith('mailto:')) return;
      e.preventDefault();
      const t = document.getElementById('pageTransition');
      if (t) { t.classList.add('is-active'); setTimeout(() => { window.location.href = href; }, 420); }
      else window.location.href = href;
    });
  });
</script>
</body>
</html>
