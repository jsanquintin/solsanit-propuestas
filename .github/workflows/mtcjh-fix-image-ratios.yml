name: Fix MTCJH image ratios

on:
  push:
    paths:
      - '.github/workflows/mtcjh-fix-image-ratios.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve image proportions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('mtcjh-demo/v2.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '.photo{min-height:430px;border:1px solid #2a4058;border-radius:28px;overflow:hidden;position:relative;background:#0e1a28}':
              '.photo{min-height:0;aspect-ratio:16/10;border:1px solid #2a4058;border-radius:28px;overflow:hidden;position:relative;background:#07101c}',

              '.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}':
              '.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block}',

              '.media{height:180px;overflow:hidden;background:#10203a}':
              '.media{height:auto;aspect-ratio:16/10;overflow:hidden;background:#0b1624;display:flex;align-items:center;justify-content:center}',

              '.media img{width:100%;height:100%;object-fit:cover;transition:.5s}':
              '.media img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;transition:.35s ease;background:#0b1624}',

              '.service:hover img{transform:scale(1.05)}':
              '.service:hover img{transform:scale(1.015)}',

              '.photo{min-height:320px}':
              '.photo{min-height:0}'
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected CSS not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/mtcjh-fix-image-ratios.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtcjh-demo/v2.html .github/workflows/mtcjh-fix-image-ratios.yml
          git commit -m "fix: preserve MTCJH image proportions"
          git push
