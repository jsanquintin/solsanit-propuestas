name: Apply MTCJH brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mtcjh-brand.yml'

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved brand identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mtcjh-demo/v2.html')
          s = p.read_text(encoding='utf-8')

          # Official MTCJH palette: Pantone 534C + Cool Gray 10 approximation.
          s = s.replace('#4d83ff', '#1B365D').replace('#83adff', '#A7A9AC')
          s = s.replace('assets/logo.webp', 'assets/mtcjh-primary.webp')

          brand_css = '''
          /* Approved MTCJH identity */
          .brand{background:rgba(250,250,250,.97);border:1px solid rgba(255,255,255,.58);border-radius:14px;padding:5px 10px;box-shadow:0 10px 28px rgba(0,0,0,.16)}
          .brand img{object-fit:contain}
          .foot img{background:rgba(250,250,250,.97);border-radius:12px;padding:5px 9px}
          '''
          if '/* Approved MTCJH identity */' not in s:
              s = s.replace('</style>', brand_css + '\n</style>')

          favicon = '<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%231B365D%22/%3E%3Ctext x=%2232%22 y=%2242%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2234%22 font-weight=%22700%22 fill=%22white%22%3EM%3C/text%3E%3C/svg%3E">'
          if 'rel="icon"' not in s:
              s = s.replace('</title>', '</title>\n' + favicon)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit brand update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtcjh-demo/v2.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: apply approved MTCJH identity to v2"
          git push
