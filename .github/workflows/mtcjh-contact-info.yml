name: MTCJH contact info

on:
  push:
    paths:
      - '.github/workflows/mtcjh-contact-info.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add official MTCJH contact information
        shell: python
        run: |
          from pathlib import Path

          p = Path('mtcjh-demo/v2.html')
          s = p.read_text(encoding='utf-8')

          # Contact styles
          marker = '.formbox{border:1px solid var(--line);border-radius:23px;padding:22px;background:#0d1928}'
          addition = marker + '.contactInfo{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.contactItem{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0b1624}.contactItem small{display:block;color:#8192a6;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.contactItem a,.contactItem span{color:#edf3fb;font-weight:700}.contactActions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}.apiNote{margin-top:12px;color:#8090a3;font-size:.76rem}.mapLink{color:#9ec0ff!important}'
          if marker in s and '.contactInfo{' not in s:
              s = s.replace(marker, addition, 1)

          # Mobile contact layout
          mobile_marker = '@media(max-width:580px){.shell{width:min(calc(100% - 22px),1180px)}'
          if mobile_marker in s and '.contactInfo{grid-template-columns:1fr}' not in s:
              s = s.replace(mobile_marker, '@media(max-width:580px){.contactInfo{grid-template-columns:1fr}.shell{width:min(calc(100% - 22px),1180px)}', 1)

          start = s.find('<section class="section alt" id="contacto">')
          end = s.find('</section>', start)
          if start == -1 or end == -1:
              raise SystemExit('Contact section not found')
          end += len('</section>')

          contact = '''<section class="section alt" id="contacto"><div class="shell form"><div><div class="ey">Contacto y solicitud de servicio</div><h2 class="title">HABLEMOS DE TU VEHÍCULO.</h2><p class="sub">Agenda una evaluación o contáctanos directamente. MTCJH está en Santo Domingo y atiende de lunes a sábado.</p><div class="contactInfo"><div class="contactItem"><small>WhatsApp</small><a href="https://wa.me/18494522208" target="_blank" rel="noopener">849-452-2208</a></div><div class="contactItem"><small>Teléfonos</small><a href="tel:+18093756053">809-375-6053</a><br><a href="tel:+18095385496">809-538-5496</a></div><div class="contactItem"><small>Horario</small><span>L–V 8:00 a. m. – 5:30 p. m.<br>Sábados 8:00 a. m. – 12:00 p. m.</span></div><div class="contactItem"><small>Correo</small><a href="mailto:mtcenterjh@gmail.com">mtcenterjh@gmail.com</a></div><div class="contactItem" style="grid-column:1/-1"><small>Dirección</small><span>Sagrario Díaz #84, antigua 30, entre calle Moca y C. Juan Erazo, Santo Domingo 10409</span><br><a class="mapLink" href="https://maps.app.goo.gl/n6eApo7gurdH6ENd9" target="_blank" rel="noopener">Abrir en Google Maps →</a></div></div><div class="contactActions"><a class="btn primary" href="https://wa.me/18494522208" target="_blank" rel="noopener">Escribir por WhatsApp</a><a class="btn" href="tel:+18093756053">Llamar al taller</a></div></div><div class="formbox"><div class="ey">Solicitud de servicio</div><div class="fields"><div class="field"><label>Marca</label><input placeholder="Ford"></div><div class="field"><label>Modelo</label><input placeholder="Explorer"></div><div class="field"><label>Año</label><input inputmode="numeric" placeholder="2022"></div><div class="field"><label>Placa</label><input placeholder="Opcional"></div></div><div class="actions"><button class="btn primary" type="button">Preparar solicitud</button></div><p class="apiNote">Este formulario quedará conectado al API de MTCJH para registrar la solicitud directamente en el sistema.</p></div></div></section>'''
          s = s[:start] + contact + s[end:]

          # Footer with official data
          fstart = s.find('<footer class="footer">')
          fend = s.find('</footer>', fstart)
          if fstart == -1 or fend == -1:
              raise SystemExit('Footer not found')
          fend += len('</footer>')
          footer = '''<footer class="footer"><div class="shell foot"><div><img src="assets/mtcjh-primary.webp" alt="MTCJH"><div>Mechanical Technical Center JH</div></div><div><a href="https://wa.me/18494522208" target="_blank" rel="noopener">WhatsApp 849-452-2208</a><br><a href="tel:+18093756053">809-375-6053</a> · <a href="tel:+18095385496">809-538-5496</a><br><a href="mailto:mtcenterjh@gmail.com">mtcenterjh@gmail.com</a></div><div><a href="https://maps.app.goo.gl/n6eApo7gurdH6ENd9" target="_blank" rel="noopener">Sagrario Díaz #84 · Santo Domingo</a><br>L–V 8:00–5:30 · Sáb. 8:00–12:00<br><a href="https://www.instagram.com/mtc_mechanic/" target="_blank" rel="noopener">@mtc_mechanic</a></div></div></footer>'''
          s = s[:fstart] + footer + s[fend:]

          p.write_text(s, encoding='utf-8')

      - name: Remove one-shot workflow
        run: rm .github/workflows/mtcjh-contact-info.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtcjh-demo/v2.html .github/workflows/mtcjh-contact-info.yml
          git commit -m "feat: add official MTCJH contact information"
          git push
