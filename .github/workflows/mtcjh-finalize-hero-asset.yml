name: Finalize MTCJH hero asset

on:
  push:
    paths:
      - '.github/workflows/mtcjh-finalize-hero-asset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build approved hero asset
        shell: bash
        run: |
          cat mtcjh-demo/.hero-b64-1 mtcjh-demo/.hero-b64-2 mtcjh-demo/.hero-b64-3 | base64 -d > mtcjh-demo/assets/mtcjh-hero-ai.webp
          test -s mtcjh-demo/assets/mtcjh-hero-ai.webp
      - name: Cleanup temp files
        shell: bash
        run: |
          rm mtcjh-demo/.hero-b64-1 mtcjh-demo/.hero-b64-2 mtcjh-demo/.hero-b64-3
          rm .github/workflows/mtcjh-finalize-hero-asset.yml
      - name: Commit hero asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish approved MTCJH hero image"
          git push
