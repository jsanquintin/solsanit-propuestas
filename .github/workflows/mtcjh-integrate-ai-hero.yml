name: Integrate MTCJH AI hero

on:
  push:
    paths:
      - '.github/workflows/mtcjh-integrate-ai-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate approved hero image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mtcjh-demo/v2.html')
          s=p.read_text(encoding='utf-8')
          old_stage_start='<div class="stage"><div class="hud">'
          i=s.find(old_stage_start)
          if i<0:
              raise SystemExit('stage start not found')
          # find matching end of stage block by locating the next closing sequence before hero grid ends
          marker='</div></div></section>'
          j=s.find(marker,i)
          if j<0:
              raise SystemExit('hero end marker not found')
          # stage occupies the final div before the two hero-grid closing divs
          old=s[i:j]
          new='''<div class="stage aiHero"><img src="assets/mtcjh-hero-ai.webp" alt="Técnico MTCJH realizando diagnóstico automotriz en un taller de alta tecnología"><div class="heroBadge"><small>ESPECIALISTAS EN</small><strong>Ford · Lincoln · Mazda</strong><span>Experiencia técnica aplicada al diagnóstico y reparación.</span></div></div>'''
          s=s[:i]+new+s[j:]
          css='''\n/* AI hero visual approved by MTCJH */\n.aiHero{min-height:520px;position:relative;overflow:hidden;border:1px solid #2a4058;border-radius:32px;background:#08111d;box-shadow:0 30px 80px #0006}\n.aiHero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}\n.aiHero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(7,16,28,.88) 100%);pointer-events:none}\n.heroBadge{position:absolute;z-index:3;left:20px;right:20px;bottom:18px;border:1px solid rgba(133,170,214,.45);border-radius:16px;background:rgba(7,16,28,.84);backdrop-filter:blur(10px);padding:14px 16px;display:grid;gap:3px}\n.heroBadge small{color:#8fa8c5;font-size:.66rem;letter-spacing:.13em}\n.heroBadge strong{font-size:1.1rem;color:#fff}\n.heroBadge span{font-size:.78rem;color:#a7b5c5}\n@media(max-width:900px){.aiHero{min-height:460px}}\n@media(max-width:580px){.aiHero{min-height:390px}.heroBadge{left:12px;right:12px;bottom:12px;padding:12px}}\n'''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/mtcjh-integrate-ai-hero.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate approved MTCJH AI hero"
          git push
